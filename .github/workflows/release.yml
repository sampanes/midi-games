# A version tag (v0.2.0) becomes a GitHub release with the Android APK and a
# Windows zip, so a TV box or another PC gets the game from the releases
# page. The APK is signed with the key in the repository secrets (made by
# scripts/make-android-key.ps1); without those secrets the Android job fails
# and says so, and the release carries only the Windows build until the job
# is re-run with them in place.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/key_games
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: pin
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - name: Signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No ANDROID_KEYSTORE_BASE64 secret, so the APK cannot be signed. Run scripts/make-android-key.ps1 and add the four secrets it lists (README: Releases), then re-run this job."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name the APK after the tag
        run: |
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/key-games-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows zip
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/key_games
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: pin
        shell: bash
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the build with the start script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\..\dist | Out-Null
          $stage = "..\..\dist\key-games-$env:GITHUB_REF_NAME-windows"
          Copy-Item build\windows\x64\runner\Release $stage -Recurse
          Copy-Item ..\..\scripts\start-key-games.bat, ..\..\scripts\stop-key-games.bat $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip"
          Remove-Item $stage -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [android, windows]
    # Publish whatever was built, so a missing signing key still releases the
    # Windows build; the APK joins when the Android job is re-run.
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Key Games $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
