name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy:
    name: Nothing private is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: private/ and .gitmodules must never be committed
        run: |
          tracked="$(git ls-files -- private .gitmodules)"
          if [ -n "$tracked" ]; then
            echo "BLOCKED: $tracked"
            exit 1
          fi

  bench:
    name: MIDI bench (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  song-editor:
    name: Song editor (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py"

  app:
    name: Key Games (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/key_games
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: pin
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
