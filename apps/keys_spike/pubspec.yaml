name: keys_spike
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_midi_command: 1.3.0
  flutter_midi_command_ble: 1.3.0
  flutter_soloud: 5.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Build SoLoud without Opus/Ogg/Vorbis/FLAC. The spike only plays synthesized
# tones, and this avoids the build hook downloading unpinned prebuilt binaries
# from a "latest" GitHub release.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
