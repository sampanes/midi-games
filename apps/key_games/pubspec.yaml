name: key_games
description: "Color and music games for kids, played on a MIDI keyboard."
publish_to: 'none'
# The version is shown in Settings > About (lib/app/about.dart keeps a copy,
# checked by a test). The build number must grow with every release so the
# Android build installs over the last one.
version: 0.2.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_midi_command: 1.3.0
  flutter_midi_command_ble: 1.3.0
  flutter_soloud: 5.1.5
  shared_preferences: ^2.3.0
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Song melodies from scripts/extract-melodies.py (ignored by Git, local only),
  # and the typeface's license (shown in the app's licenses page).
  assets:
    - assets/songs/
    - assets/fonts/OFL-Nunito.txt
  # Nunito (SIL Open Font License), static weights instanced from the
  # variable font at github.com/google/fonts/tree/main/ofl/nunito.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

# Build SoLoud without Opus/Ogg/Vorbis/FLAC. The games only play synthesized
# tones, and this avoids the build hook downloading unpinned prebuilt binaries
# from a "latest" GitHub release.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
